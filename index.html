<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Bones — Playable Alpha</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#090d14;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.app{max-width:900px;margin:auto;padding:12px 12px 80px}.brand{font-size:25px;font-weight:950;margin:5px 0 12px}.tiny{font-size:12px;color:#9ca3af}.panel{background:#121a27;border:1px solid #334155;border-radius:18px;padding:14px;margin-bottom:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin-top:9px}.field label{display:block;font-size:11px;font-weight:850;text-transform:uppercase;color:#94a3b8;margin-bottom:5px}input,select{width:100%;padding:12px;border:1px solid #334155;border-radius:11px;background:#0b1220;color:#fff;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:12px;font-weight:900;background:#f8fafc;color:#111827}.secondary{background:#263449;color:#fff}.green{background:#22c55e}.gold{background:#f59e0b}.hidden{display:none!important}.roomcode{font-size:29px;letter-spacing:.15em;font-weight:950;color:#fde68a}.seats,.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:7px}.seat,.score{background:#0b1220;border:1px solid #334155;border-radius:13px;padding:10px;text-align:center}.seat.you,.score.you{outline:2px solid #60a5fa}.score.turn{outline:3px solid #fbbf24}.pts{font-size:22px;font-weight:950}.table{position:relative;min-height:310px;background:radial-gradient(circle,#23633e,#123d29 72%);border:9px solid #513822;border-radius:32px;padding:12px;overflow:hidden}.tabletop{display:grid;grid-template-areas:"top top top" "left chain right" "bottom bottom bottom";grid-template-columns:70px 1fr 70px;grid-template-rows:58px minmax(160px,1fr) 58px;min-height:280px}.pos{font-size:11px;text-align:center;color:#d1d5db}.top{grid-area:top}.left{grid-area:left;writing-mode:vertical-rl}.right{grid-area:right;writing-mode:vertical-rl}.bottom{grid-area:bottom}.chain{grid-area:chain;display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap}.domino{width:38px;height:70px;background:#fffdf4;color:#111;border-radius:7px;border:2px solid #d1c7b5;display:grid;grid-template-rows:1fr 2px 1fr;box-shadow:0 3px 7px #0007;flex:none}.domino.playable{outline:3px solid #fbbf24;transform:translateY(-4px)}.divider{background:#555}.face{display:grid;place-items:center;font-size:18px;font-weight:950}.hand{display:flex;gap:7px;overflow-x:auto;padding:12px 2px}.status{text-align:center;font-weight:900;margin:5px}.wash{position:fixed;inset:0;background:#060a10ed;z-index:30;display:none;align-items:center;justify-content:center}.wash.show{display:flex}.sink{width:min(90vw,480px);height:330px;background:linear-gradient(145deg,#b9c0c6,#68737c);border:12px solid #d8dde0;border-radius:28px;box-shadow:inset 0 0 35px #111b;text-align:center;position:relative;overflow:hidden}.sinktitle{font-size:25px;font-weight:950;color:#111;margin-top:20px}.basin{position:absolute;left:12%;right:12%;top:70px;bottom:35px;border-radius:45%;background:radial-gradient(circle,#6db4cc,#173d4d 70%);box-shadow:inset 0 0 25px #000b}.drain{position:absolute;width:45px;height:45px;border-radius:50%;background:#1f2937;left:calc(50% - 22px);top:calc(50% - 5px)}.washbone{position:absolute;width:27px;height:48px;background:#fff8e8;border:1px solid #aaa;border-radius:5px;animation:swirl 1.1s infinite linear;left:calc(50% - 14px);top:145px;transform-origin:10px 50px}.washbone:nth-child(2){animation-delay:-.18s}.washbone:nth-child(3){animation-delay:-.36s}.washbone:nth-child(4){animation-delay:-.54s}.washbone:nth-child(5){animation-delay:-.72s}.washbone:nth-child(6){animation-delay:-.9s}@keyframes swirl{0%{transform:rotate(0deg) translateX(25px) rotate(0)}100%{transform:rotate(360deg) translateX(85px) rotate(-720deg)}}.notice{background:#3b2f16;border:1px solid #8a6d26;border-radius:12px;padding:9px;font-size:12px;color:#fde68a}.modal{position:fixed;inset:0;background:#020617df;display:none;align-items:center;justify-content:center;padding:18px;z-index:25}.modal.show{display:flex}.box{max-width:420px;width:100%;background:#172033;border:1px solid #475569;border-radius:20px;padding:18px;text-align:center}.claimgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}@media(max-width:560px){.row{grid-template-columns:1fr}.table{border-radius:25px}.tabletop{grid-template-columns:48px 1fr 48px}.domino{width:34px;height:62px}.brand{font-size:22px}}</style></head><body><div class="app"><div class="brand">🁣 BONES <span class="tiny">PLAYABLE ALPHA</span></div><section id="setup" class="panel"><h2>Get to the table.</h2><input id="playerName" maxlength="18" placeholder="Your table name"><div class="field"><label>Starting Coins</label><select id="startingCoins"><option>25</option><option selected>50</option><option>100</option><option>250</option><option>500</option></select></div><div class="row" style="margin-top:9px"><button class="btn" onclick="createRoom()">Create Table</button><button class="btn secondary" onclick="joinBox.classList.toggle('hidden')">Join Table</button></div><div id="joinBox" class="hidden" style="margin-top:8px"><input id="codeInput" maxlength="6" placeholder="ROOM CODE"><button class="btn" style="margin-top:7px" onclick="joinRoom()">Join</button></div><div id="warn" class="notice hidden" style="margin-top:9px">Supabase is not configured.</div></section><section id="lobby" class="hidden"><div class="panel"><div class="tiny">PRIVATE TABLE</div><div id="codeView" class="roomcode"></div><div id="seats" class="seats"></div><div id="hostRules" class="hidden"><h3>Table Rules</h3><div class="row"><div class="field"><label>Game Mode</label><select id="mode"><option value="cutthroat">Cutthroat</option><option value="teams">Teams</option></select></div><div class="field"><label>Scoring</label><select id="points"><option value="no5">No 5s</option><option value="5">5s allowed</option></select></div></div><div class="field"><label>Get-In Count</label><select id="getin"><option value="10" selected>10</option><option value="0">Off</option></select></div><div class="field"><label>Game To</label><select id="target"><option>150</option><option>200</option><option selected>250</option><option>300</option><option>350</option><option>400</option><option>500</option></select></div><button id="start" class="btn green" style="margin-top:10px" onclick="startGame()">Wash & Deal</button></div><div id="waiting" class="tiny"></div></div></section><section id="game" class="hidden"><div class="panel"><div id="scores" class="scoreboard"></div></div><div class="status" id="turn"></div><div class="table"><div class="tabletop"><div class="pos top" id="p2"></div><div class="pos left" id="p1"></div><div id="chain" class="chain"></div><div class="pos right" id="p3"></div><div class="pos bottom" id="p0"></div></div></div><div class="panel"><div class="tiny">YOUR BONES</div><div id="hand" class="hand"></div><button id="pass" class="btn secondary" onclick="passTurn()">Pass</button><button id="next" class="btn gold hidden" onclick="nextHand()">Wash Next Hand</button></div><div class="panel"><div class="tiny">TABLE LOG</div><div id="log" class="tiny"></div></div></section></div><div id="wash" class="wash"><div class="sink"><div class="sinktitle">WASHING THE BONES</div><div class="basin"><div class="drain"></div><i class="washbone"></i><i class="washbone"></i><i class="washbone"></i><i class="washbone"></i><i class="washbone"></i><i class="washbone"></i></div></div></div><div id="sideModal" class="modal"><div class="box"><h2>Which end?</h2><div class="row"><button class="btn" onclick="chooseSide('L')">Left</button><button class="btn" onclick="chooseSide('R')">Right</button></div></div></div><div id="claimModal" class="modal"><div class="box"><div class="tiny">CALL YOUR MONEY</div><div id="timer" style="font-size:38px;font-weight:950">8</div><p>How many points?</p><div id="claimgrid" class="claimgrid"></div></div></div><div id="winModal" class="modal"><div class="box"><div class="tiny">GAME COMPLETE</div><div id="winner" style="font-size:32px;font-weight:950;color:#fde68a"></div><p id="wintext"></p></div></div><script>const cfg=window.DOMINO_CONFIG||{},ok=cfg.supabaseUrl&&!cfg.supabaseUrl.includes('YOUR_')&&cfg.supabaseKey&&!cfg.supabaseKey.includes('YOUR_');let sb=ok?supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey):null;if(!ok)warn.classList.remove('hidden');let room=null,roomCode='',version=0,pending=null,claimTick=null,token=localStorage.dominoToken||crypto.randomUUID();localStorage.dominoToken=token;playerName.value=localStorage.dominoName||'';const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rnd(n){let a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n,x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}function rc(){let c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>c[rnd(c.length)]).join('')}function me(){return room?.players.find(p=>p.token===token)}function seat(){return me()?.seat}function host(){return room?.host===token}function base(n,coins){return{phase:'lobby',host:token,startingCoins:coins,players:[{token,name:n,seat:0,wallet:coins}],rules:{mode:'cutthroat',points:'no5',getin:10,target:250},scores:[0,0,0,0],qualified:[false,false,false,false],hands:[[],[],[],[]],chain:[],turn:0,handNo:0,leaderReason:'',lastDomino:null,log:[],winner:null}}async function createRoom(){if(!ok)return alert('Supabase is not configured.');let n=playerName.value.trim()||'Player 1';localStorage.dominoName=n;for(let i=0;i<5;i++){let c=rc(),st=base(n,+startingCoins.value||50),r=await sb.from('domino_rooms').insert({code:c,state:st,version:1});if(!r.error){room=st;roomCode=c;version=1;sub();render();return}}alert('Try creating again.')}async function joinRoom(){if(!ok)return alert('Supabase is not configured.');let n=playerName.value.trim()||'Player',c=codeInput.value.trim().toUpperCase();localStorage.dominoName=n;let r=await sb.from('domino_rooms').select('*').eq('code',c).single();if(r.error)return alert('Room not found.');room=r.data.state;version=r.data.version;if(room.phase!=='lobby')return alert('Game already started.');if(!room.players.find(p=>p.token===token)){if(room.players.length>=4)return alert('Table full.');room.players.push({token,name:n,seat:room.players.length,wallet:room.startingCoins||50})}roomCode=c;await save();sub();render()}function sub(){sb.channel('room-'+roomCode).on('postgres_changes',{event:'UPDATE',schema:'public',table:'domino_rooms',filter:'code=eq.'+roomCode},p=>{if(p.new.version>=version){version=p.new.version;room=p.new.state;render();checkClaim()}}).subscribe()}async function save(){let nv=version+1,r=await sb.from('domino_rooms').update({state:room,version:nv,updated_at:new Date().toISOString()}).eq('code',roomCode).eq('version',version).select();if(r.data?.length){version=nv;return true}let f=await sb.from('domino_rooms').select('*').eq('code',roomCode).single();if(f.data){version=f.data.version;room=f.data.state;render()}return false}function render(){setup.classList.toggle('hidden',!!room);lobby.classList.toggle('hidden',!room||room.phase!=='lobby');game.classList.toggle('hidden',!room||room.phase==='lobby');if(!room)return;room.phase==='lobby'?renderLobby():renderGame()}function renderLobby(){codeView.textContent=roomCode;seats.innerHTML=[0,1,2,3].map(i=>{let p=room.players.find(x=>x.seat===i);return`<div class="seat ${p?.token===token?'you':''}"><div class="tiny">SEAT ${i+1}</div><b>${p?E(p.name):'Waiting...'}</b></div>`}).join('');hostRules.classList.toggle('hidden',!host());waiting.classList.toggle('hidden',host());start.disabled=room.players.length!==4;if(host()){mode.value=room.rules.mode;points.value=room.rules.points;getin.value=room.rules.getin;target.value=room.rules.target}else waiting.textContent='Waiting for host.'}function deck(){let d=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)d.push([a,b]);for(let i=d.length-1;i>0;i--){let j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}function highestDouble(hands){for(let v=6;v>=0;v--)for(let s=0;s<4;s++)if(hands[s].some(t=>t[0]===v&&t[1]===v))return{s,v};return{s:0,v:0}}function washAnim(){wash.classList.add('show');setTimeout(()=>wash.classList.remove('show'),1450)}function deal(forceLeader=null,reason='double'){let d=deck();room.hands=[[],[],[],[]];let dealerStart=0;for(let i=0;i<28;i++)room.hands[(dealerStart+i)%4].push(d[i]);room.chain=[];let hd=highestDouble(room.hands);room.turn=forceLeader??hd.s;room.leaderReason=forceLeader==null?`Big ${hd.v} starts`:`${room.players[forceLeader].name} leads after domino`;room.handNo++;room.pendingClaim=null;room.log.unshift(`Hand ${room.handNo}: ${room.leaderReason}.`);washAnim()}async function startGame(){if(!host()||room.players.length!==4)return;room.rules={mode:mode.value,points:points.value,getin:+getin.value,target:+target.value};room.scores=[0,0,0,0];room.qualified=[room.rules.getin===0,room.rules.getin===0,room.rules.getin===0,room.rules.getin===0];room.phase='playing';room.winner=null;room.handNo=0;room.lastDomino=null;deal(null,'new');await save()}function scoreOf(i){return room.rules.mode==='teams'?room.scores[i%2]:room.scores[i]}function setScore(i,v){if(room.rules.mode==='teams')room.scores[i%2]=v;else room.scores[i]=v}function qual(i){return room.rules.mode==='teams'?room.qualified[i%2]:room.qualified[i]}function setQual(i,v){if(room.rules.mode==='teams')room.qualified[i%2]=v;else room.qualified[i]=v}function endsNow(){if(!room.chain.length)return[null,null];return[room.chain[0][0],room.chain.at(-1)[1]]}function can(t){if(!room.chain.length)return true;let[e1,e2]=endsNow();return t.includes(e1)||t.includes(e2)}function has(h){return h.some(can)}function dots(v){return['','●','● ●','● ● ●','● ●\n● ●','● ●\n ● \n● ●','● ●\n● ●\n● ●'][v]}function dom(t,i,play){return`<div class="domino ${play?'playable':''}" ${play?`onclick="tap(${i})"`:''}><div class="face">${dots(t[0]).replaceAll('\n','<br>')}</div><div class="divider"></div><div class="face">${dots(t[1]).replaceAll('\n','<br>')}</div></div>`}function totalEnds(){if(!room.chain.length)return 0;let[l,r]=endsNow(),f=room.chain[0],z=room.chain.at(-1);if(room.chain.length===1&&f[0]===f[1])return f[0]*2;return(f[0]===f[1]?l*2:l)+(z[0]===z[1]?r*2:r)}function money(){let v=Math.round(totalEnds()/5)*5;if(v<5)return 0;if(room.rules.points==='no5'&&v===5)return 0;return v}function renderGame(){let s=seat();scores.innerHTML=room.players.map((p,i)=>`<div class="score ${i===s?'you':''} ${room.turn===i&&room.phase==='playing'?'turn':''}"><b>${E(p.name)}</b><div class="pts">${scoreOf(i)}</div><div class="tiny">${qual(i)?'IN':'NOT IN'} · 🪙${p.wallet}</div></div>`).join('');[0,1,2,3].forEach(i=>document.getElementById('p'+i).textContent=room.players[i]?.name||'');chain.innerHTML=room.chain.length?room.chain.map(t=>dom(t,null,false)).join(''):'<div class="tiny">Open table</div>';hand.innerHTML=(room.hands[s]||[]).map((t,i)=>dom(t,i,room.turn===s&&can(t)&&room.phase==='playing')).join('');turn.textContent=room.phase==='hand_over'?'Hand complete':room.phase==='game_over'?'Game complete':room.turn===s?`YOUR TURN · ${room.leaderReason||''}`:`${room.players[room.turn].name}'s turn`;pass.disabled=room.turn!==s||has(room.hands[s]||[])||room.phase!=='playing';next.classList.toggle('hidden',!(room.phase==='hand_over'&&host()));log.innerHTML=(room.log||[]).slice(0,16).map(x=>`<div>${E(x)}</div>`).join('');if(room.phase==='game_over')showWin()}function sides(t){if(!room.chain.length)return['R'];let[l,r]=endsNow(),a=[];if(t.includes(l))a.push('L');if(t.includes(r))a.push('R');return[...new Set(a)]}function tap(i){let t=room.hands[seat()][i],s=sides(t);if(s.length===2){pending={i};sideModal.classList.add('show')}else if(s.length===1)play(i,s[0])}function chooseSide(s){sideModal.classList.remove('show');if(pending){play(pending.i,s);pending=null}}function orient(t,s){if(!room.chain.length)return t;if(s==='L'){let l=endsNow()[0];return t[1]===l?t:[t[1],t[0]]}let r=endsNow()[1];return t[0]===r?t:[t[1],t[0]]}async function play(i,s){if(room.turn!==seat())return;let t=room.hands[seat()][i];if(!can(t))return;let q=orient(t,s);room.hands[seat()].splice(i,1);s==='L'?room.chain.unshift(q):room.chain.push(q);let v=money();if(!room.hands[seat()].length)return resolveDomino(seat());if(v>0){room.pendingClaim={seat:seat(),value:v};await save();checkClaim();return}advance();await save()}function checkClaim(){if(!room?.pendingClaim||room.pendingClaim.seat!==seat()||claimModal.classList.contains('show'))return;claimModal.classList.add('show');claimgrid.innerHTML='';for(let v=5;v<=60;v+=5){let b=document.createElement('button');b.className='btn secondary';b.textContent=v;b.onclick=()=>claim(v);claimgrid.appendChild(b)}let n=8;timer.textContent=n;clearInterval(claimTick);claimTick=setInterval(()=>{timer.textContent=--n;if(n<=0){clearInterval(claimTick);claim(-1)}},1000)}async function claim(v){clearInterval(claimTick);claimModal.classList.remove('show');let right=room.pendingClaim.value,s=seat();if(v===right){if(!qual(s)){if(v>=10){setQual(s,true);setScore(s,scoreOf(s)+v);room.log.unshift(`${me().name} got IN with ${v}.`)}else room.log.unshift(`${me().name} called ${v}, but needs 10+ to get in.`)}else{setScore(s,scoreOf(s)+v);room.log.unshift(`${me().name} called ${v}.`)}}else if(v>=0){setScore(s,scoreOf(s)-right);room.log.unshift(`${me().name} missed the call. Correct: ${right}.`)}room.pendingClaim=null;if(checkWinner())return endGame();advance();await save()}function advance(){room.turn=(room.turn+1)%4;let n=0;while(n<4&&!has(room.hands[room.turn])){room.log.unshift(`${room.players[room.turn].name} passes.`);room.turn=(room.turn+1)%4;n++}if(n>=4)locked()}async function passTurn(){if(room.turn!==seat()||has(room.hands[seat()]))return;advance();await save()}function pip(h){return h.reduce((a,t)=>a+t[0]+t[1],0)}async function resolveDomino(s){let raw=room.hands.reduce((a,h,i)=>i===s?a:a+pip(h),0),b=Math.round(raw/5)*5;if(qual(s)){setScore(s,scoreOf(s)+b);room.log.unshift(`${room.players[s].name} DOMINO — ${b}.`)}else room.log.unshift(`${room.players[s].name} DOMINO — not in, no hand points.`);room.lastDomino=s;if(checkWinner())return endGame();room.phase='hand_over';await save()}async function locked(){room.log.unshift('LOCKED BOARD — highest double leads after the wash.');room.lastDomino=null;room.phase='hand_over';await save()}function checkWinner(){if(room.rules.mode==='teams'){if(room.scores[0]>=room.rules.target){room.winner={type:'team',id:0};return true}if(room.scores[1]>=room.rules.target){room.winner={type:'team',id:1};return true}}else{let i=room.scores.findIndex(x=>x>=room.rules.target);if(i>=0){room.winner={type:'player',id:i};return true}}return false}function winnerName(){if(room.winner.type==='player')return room.players[room.winner.id].name;return room.winner.id===0?`${room.players[0].name} + ${room.players[2].name}`:`${room.players[1].name} + ${room.players[3].name}`}async function endGame(){room.phase='game_over';let o=room.winner.type==='player'?room.scores.filter((_,i)=>i!==room.winner.id):[room.scores[room.winner.id===0?1:0]];room.peter=Math.max(...o)<=75;await save();showWin()}function showWin(){winModal.classList.add('show');winner.textContent=winnerName();wintext.innerHTML=`wins the table.${room.peter?'<br><b>🔥 PETER ROLL</b>':''}`}async function nextHand(){if(!host()||room.phase!=='hand_over')return;let leader=room.lastDomino;room.phase='playing';deal(leader);room.lastDomino=null;await save()}</script></body></html>
